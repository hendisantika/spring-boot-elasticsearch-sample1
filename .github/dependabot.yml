version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework.data*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      logging:
        patterns:
          - "ch.qos.logback*"
          - "org.slf4j*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images in compose.yaml (Elasticsearch)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
